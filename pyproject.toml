[project]
name = "ai-engine-hackathon-2026"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
# The image's Python, rather than one uv downloads.
python-preference = "only-system"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "RUF", "ASYNC", "ANN"]

[tool.basedpyright]
include = ["test-policy.py"]
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
]
