[mock-robot]
description = "UR12e and 2F-140 on mock hardware; takes camera:=true to add the Gemini 336, rviz:=true"
dir = "{{config_root}}/crates/policy-runner"
run = "ros2 launch launch/robot.launch.xml robot:=mock"

[real-robot]
description = "UR12e, 2F-140 and Gemini 336; takes robot_ip:=<address> (default 192.168.56.101), camera:=false, rviz:=true, headless_mode:=false"
dir = "{{config_root}}/crates/policy-runner"
run = "ros2 launch launch/robot.launch.xml robot:=real"

[fake-policy]
description = "A stand-in policy on port 8000; `mise run fake-policy -- --help` lists late, chunked and invalid replies"
dir = "{{config_root}}/crates/policy-runner"
run = "python3 scripts/fake_policy.py"

[policy-runner]
description = "The policy runner; takes --task <task_id>, and --policy <url>, --camera <topic>"
run = "cargo run --release -p policy-runner --"
