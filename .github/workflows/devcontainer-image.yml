name: Devcontainer image

on:
  push:
    branches: [main]
    paths: [".devcontainer/**", ".github/workflows/devcontainer-image.yml"]
  pull_request:
    paths: [".devcontainer/**", ".github/workflows/devcontainer-image.yml"]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Monday 4am

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/whistlerobotics/ai-engine-hackathon-2026-devcontainer

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Registry cache rather than `type=gha`: the Actions cache is capped at 10 GB per repo,
      # and devcontainer.json's `cacheFrom` can read this tag for local builds.
      - uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          build-args: USERNAME=rosdev
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
